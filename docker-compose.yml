version: '3.8'

services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - backend

  init-ollama:
    image: curlimages/curl:latest
    volumes:
      - ./init-models.sh:/init-models.sh
    depends_on:
      - ollama
    command: sh /init-models.sh
    networks:
      - backend

volumes:
  ollama_models:

networks:
  backend:
    driver: bridge
