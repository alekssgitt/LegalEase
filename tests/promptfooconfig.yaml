# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
prompts:
  - id: prompts/qa_general.txt
    label: qa_general
  - id: prompts/qa_rag.txt
    label: qa_rag

providers:
  - id: ollama:llama3.2
    config:
      baseUrl: http://localhost:11434
      model: llama3.2
      num_predict: 256
      temperature: 0.2

tests:
  - name: "General Legal Question - Lease Agreement"
    vars:
      question: "What is a residential lease agreement?"
    prompt: qa_general
    provider: ollama:llama3.2
    assert:
      - type: contains
        value: "lease"
        ignoreCase: true

  - name: "General Legal Question - Eviction"
    vars:
      question: "What is the eviction process?"
    prompt: qa_general
    provider: ollama:llama3.2
    assert:
      - type: contains
        value: "notice"
        ignoreCase: true

  - name: "General Legal Question - Security Deposit"
    vars:
      question: "What is a security deposit and what are the laws around it?"
    prompt: qa_general
    provider: ollama:llama3.2
    assert:
      - type: contains
        value: "deposit"
        ignoreCase: true
      - type: contains
        value: "landlord"
        ignoreCase: true

  - name: "Document-based Question - Rent Due Date"
    vars:
      context: |
        RESIDENTIAL LEASE AGREEMENT
        This agreement made on January 1, 2025, between Landlord and Tenant.
        Tenant agrees to pay $1,500 per month on the first day of each month.
        Tenant shall maintain the property in good condition.
        Tenant shall not sublet without written permission from Landlord.
        Late fees of $50 apply for payments received after the 5th of the month.
      question: "When is the rent due according to this lease?"
    prompt: qa_rag
    provider: ollama:llama3.2
    assert:
      - type: contains
        value: "first day"
        ignoreCase: true

  - name: "Document-based Question - Late Fees"
    vars:
      context: |
        RESIDENTIAL LEASE AGREEMENT
        This agreement made on January 1, 2025, between Landlord and Tenant.
        Tenant agrees to pay $1,500 per month on the first day of each month.
        Tenant shall maintain the property in good condition.
        Tenant shall not sublet without written permission from Landlord.
        Late fees of $50 apply for payments received after the 5th of the month.
      question: "What are the late fees according to this lease?"
    prompt: qa_rag
    provider: ollama:llama3.2
    assert:
      - type: contains
        value: "$50"
        ignoreCase: true

  - name: "Document-based Question - Subletting"
    vars:
      context: |
        RESIDENTIAL LEASE AGREEMENT
        This agreement made on January 1, 2025, between Landlord and Tenant.
        Tenant agrees to pay $1,500 per month on the first day of each month.
        Tenant shall maintain the property in good condition.
        Tenant shall not sublet without written permission from Landlord.
        Late fees of $50 apply for payments received after the 5th of the month.
      question: "Can I sublet the property according to this lease?"
    prompt: qa_rag
    provider: ollama:llama3.2
    assert:
      - type: contains
        value: "written permission"
        ignoreCase: true

  - name: "Document-based Question - Employment Contract"
    vars:
      context: |
        EMPLOYMENT AGREEMENT
        This Employment Agreement ("Agreement") is made and effective as of March 15, 2025, by and between ABC Corp ("Employer") and Jane Doe ("Employee").
        
        1. POSITION AND DUTIES
        Employee shall be employed as a Senior Software Engineer and shall perform duties as assigned by the direct manager.
        
        2. COMPENSATION
        Employer shall pay Employee a base salary of $120,000 per year, payable bi-weekly.
        Employee shall be eligible for an annual performance bonus of up to 15% of base salary.
        
        3. TERM AND TERMINATION
        This Agreement shall commence on April 1, 2025 and continue until terminated.
        Either party may terminate this Agreement with 30 days written notice.
        Employer may terminate immediately for cause without notice.
      question: "What is the base salary in this employment contract?"
    prompt: qa_rag
    provider: ollama:llama3.2
    assert:
      - type: contains
        value: "$120,000"
        ignoreCase: true
